<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KX · Conversor · KOOWEXA</title><link rel="stylesheet" href="../../assets/css/main.css"></head><body><header class="top"><a class="brand" href="../../"><b>K</b> KOOWEXA</a><nav><a href="../../">Inicio</a><a href="../kw/">KW</a><a href="../ac/">AC</a><a href="../px/">PX</a></nav></header><main class="wrap page"><p class="eyebrow">KX · HERRAMIENTA</p><h1>Conversor de monedas</h1><section class="panel"><p class="muted">Calculadora de referencia con tasa editable; no es una cotización en tiempo real.</p><div class="grid"><label>Importe<input id="amount" type="number" min="0" value="1"></label><label>Tasa de referencia<input id="rate" type="number" min="0" value="320"></label><label>De<select id="from"><option>CUP</option><option>USD</option><option>EUR</option></select></label><label>A<select id="to"><option>USD</option><option>CUP</option><option>EUR</option></select></label></div><h2 id="result">320.00</h2></section></main><footer>© KOOWEXA</footer><script>const ids=["amount","rate","from","to"].map(x=>document.getElementById(x));function draw(){const [a,r,f,t]=ids;document.getElementById("result").textContent=(f.value===t.value?Number(a.value):Number(a.value)*Number(r.value)).toLocaleString("es",{maximumFractionDigits:2})+" "+t.value}ids.forEach(x=>x.addEventListener("input",draw));draw();</script></body></html>

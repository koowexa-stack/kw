async function decodeModule(encoded){
  if(!('DecompressionStream' in window)) throw new Error('Este navegador no admite la descompresión integrada requerida. Abre la versión desplegada en un navegador actualizado.');
  const binary=atob(encoded);const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

  decodeModule(pages[key]).then(html=>{document.getElementById('frame-'+key).srcdoc=html;}).catch(err=>{
    console.error('No se pudo cargar el módulo '+key,err);
    document.getElementById('frame-'+key).srcdoc='<main style="font:16px system-ui;padding:24px"><h1>KOOWEXA</h1><p>No se pudo abrir este módulo. Actualiza el navegador e inténtalo de nuevo.</p></main>';
  });
}
function activate(key){for(const b of document.querySelectorAll('[data-tab]'))b.setAttribute('aria-selected',String(b.dataset.tab===key));for(const f of document.querySelectorAll('.module'))f.classList.toggle('active',f.id==='frame-'+key);}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.tab)));
window.addEventListener('message',e=>{if(e.data&&e.data.kwModule&&pages[e.data.kwModule])activate(e.data.kwModule)});
</script>
<script>
(function(){
  const installButton=document.getElementById('installApp');
  let installPrompt=null;
  window.addEventListener('beforeinstallprompt',function(event){
    event.preventDefault();installPrompt=event;installButton.hidden=false;
  });
  installButton.addEventListener('click',async function(){
    if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return;}
    const ua=navigator.userAgent||'';const ios=/iphone|ipad|ipod/i.test(ua);const localFile=location.protocol==='file:';
    let message;
    if(localFile){message='Estás abriendo el archivo directamente. Para añadirlo desde un navegador, publica este mismo HTML en una URL HTTPS y abre esa URL.';}
    else if(ios){message='En iPhone/iPad, abre esta página en Safari, pulsa Compartir y selecciona “Añadir a pantalla de inicio”, si aparece.';}
    else{message='Abre el menú del navegador y busca “Instalar aplicación” o “Añadir a pantalla de inicio”, si está disponible para esta página.';}
    message+='\n\nEsta edición está contenida en un solo HTML. Para una PWA con instalación promocionada y funcionamiento offline garantizado hacen falta un manifiesto y un service worker publicados aparte; este archivo no depende de ellos y no los simula.';
    alert(message);
  });
  window.addEventListener('appinstalled',function(){installPrompt=null;installButton.hidden=true;});
})();
</script>
